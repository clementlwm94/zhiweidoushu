version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zhiwei-rag:latest
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_STORE_PATH: /app/store_location
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-zhiwei_DAG}
      QDRANT_EMBEDDING_MODEL: ${QDRANT_EMBEDDING_MODEL:-jinaai/jina-embeddings-v2-base-zh}
      QDRANT_SPARSE_MODEL: ${QDRANT_SPARSE_MODEL:-Qdrant/BM25}
      QDRANT_LLM_TEMPERATURE: ${QDRANT_LLM_TEMPERATURE:-0.3}
    ports:
      - "8000:8000"
    volumes:
      - ./store_location:/app/store_location
    depends_on:
      - qdrant
      - phoenix

  qdrant:
    image: qdrant/qdrant:v1.9.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_PORT: "6006"

volumes: {}
